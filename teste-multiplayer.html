<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Velha Vila — Teste de conexão</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}body{background:#101927;color:#e9f3ff;margin:0;padding:16px;max-width:640px;margin-inline:auto}h1{font-size:24px}p{color:#aebed1}.panel{background:#1d2d40;border:1px solid #425569;border-radius:12px;padding:14px;margin:14px 0}label{display:block;font-size:13px;margin-top:8px}input{background:#0b1320;border:1px solid #607080;border-radius:7px;color:#fff;font-size:15px;padding:10px;box-sizing:border-box;width:100%}button{border:0;border-radius:8px;background:#247ac2;color:white;padding:12px 16px;margin-top:8px;font-size:16px}button:disabled{opacity:.5}canvas{display:block;width:100%;background:#172c21;border:2px solid #65836a;border-radius:8px;box-sizing:border-box;image-rendering:pixelated}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:240px;margin:8px auto}.controls button{margin:0;font-weight:bold}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}small{color:#aabbc9}.log{height:90px;overflow:auto;font:12px monospace;white-space:pre-wrap}</style></head>
<body><h1>Velha Vila — teste multiplayer</h1><p>Esta tela é apenas para testar o servidor, não é o jogo oficial.</p>
<div class="panel"><label for="url">Endereço WebSocket do Render</label><input id="url" placeholder="wss://seu-servidor.onrender.com/ws" autocomplete="off" spellcheck="false"><label for="name">Nome do jogador</label><input id="name" value="Jogador" maxlength="24"><button id="connect">Conectar</button> <span id="status">Desconectado</span></div>
<div class="panel"><p id="online">0 jogadores conectados</p><canvas id="map" width="480" height="320"></canvas><div class="controls"><button id="up" class="up">↑</button><button id="left" class="left">←</button><button id="down" class="down">↓</button><button id="right" class="right">→</button></div><small>Teste com dois celulares ou abas, usando nomes diferentes. A posição dos jogadores será compartilhada.</small></div>
<div class="panel"><strong>Eventos</strong><div id="log" class="log"></div></div>
<script>
const $=id=>document.getElementById(id);let ws=null,me=null,players=new Map();
const log=message=>{$('log').textContent=`${new Date().toLocaleTimeString()} ${message}\n`+$('log').textContent.slice(0,1800)};
function draw(){const c=$('map'),ctx=c.getContext('2d');ctx.clearRect(0,0,480,320);ctx.strokeStyle='#294934';ctx.lineWidth=1;for(let x=0;x<=480;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,320);ctx.stroke()}for(let y=0;y<=320;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(480,y);ctx.stroke()}const arr=[...players.values()];$('online').textContent=`${arr.length} jogador(es) no mesmo mapa`;for(const p of arr){const x=((p.x%20)+20)%20*24+12,y=((p.y%13)+13)%13*24+12;ctx.fillStyle=p.id===me?'#57ccfa':'#ffcf61';ctx.fillRect(x-9,y-9,18,18);ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(p.name,x,y-14)}}
$('connect').onclick=()=>{const url=$('url').value.trim();try{const u=new URL(url);if(u.protocol!=='wss:'&&u.protocol!=='ws:')throw Error('URL inválida');if(ws)ws.close();players.clear();me=null;draw();$('status').textContent='Conectando…';ws=new WebSocket(url);ws.onopen=()=>{ws.send(JSON.stringify({type:'join',name:$('name').value||'Jogador',x:10,y:10}));$('status').textContent='Conectado';log('Conexão aberta')};ws.onmessage=ev=>{let a;try{a=JSON.parse(ev.data)}catch{return}if(a.type==='connected'){me=a.id}else if(a.type==='snapshot'){me=a.you;players=new Map(a.players.map(p=>[p.id,p]));log('Mundo compartilhado recebido')}else if(a.type==='player_joined'||a.type==='player_moved'){players.set(a.player.id,a.player)}else if(a.type==='player_left'){players.delete(a.id)}else if(a.type==='chat'){log(`${a.name}: ${a.text}`)}else if(a.type==='error'){log('ERRO: '+a.message)}draw()};ws.onclose=()=>{$('status').textContent='Desconectado';log('Conexão fechada')};ws.onerror=()=>{log('Falha na conexão; confira a URL e o estado do Render')}}catch(e){log('Insira uma URL válida do Render')}};
function move(dx,dy){if(!ws||ws.readyState!==1||!me||!players.has(me))return;const p=players.get(me);p.x=Math.max(0,p.x+dx);p.y=Math.max(0,p.y+dy);ws.send(JSON.stringify({type:'move',x:p.x,y:p.y}));draw()}for(const [key,dx,dy] of [['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]])$(key).onclick=()=>move(dx,dy);document.addEventListener('keydown',e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}});draw();
</script></body></html>
